<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc">
        <div class="calc-screen">
            <p>0</p>
        </div>

        <div class="buttons">
            <div class="btn bg-orange percent">%</div>
            <div class="btn bg-orange share">/</div>
            <div class="btn bg-orange C">C</div>
            <div class="btn bg-orange remove"><img src="./remove-btn.png" alt=""></div>

            <div class="btn seven">7</div>
            <div class="btn eight">8</div>
            <div class="btn nine">9</div>
            <div class="btn multiplication bg-grey">X</div>

            <div class="btn four">4</div>
            <div class="btn five">5</div>
            <div class="btn six">6</div>
            <div class="btn bg-grey minus">-</div>


            <div class="btn one">1</div>
            <div class="btn two">2</div>
            <div class="btn three">3</div>
            <div class="btn plus bg-grey">+</div>

            <div class="btn">+/-</div>
            <div class="btn zero">0</div>
            <div class="btn  comma">,</div>
            <div class="btn bg-grey equals">=</div>

        </div>
    </div>

<script src="./math.js"></script>
</body>
</html>
